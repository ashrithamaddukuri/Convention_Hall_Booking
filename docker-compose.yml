version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ch_postgres
    environment:
      POSTGRES_DB:       conventionhall
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ch_backend
    environment:
      DB_URL:      jdbc:postgresql://postgres:5432/conventionhall
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET:  SuperSecretKeyForProductionReplaceThis!!2024
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ch_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
