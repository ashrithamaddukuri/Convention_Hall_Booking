spring:
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/conventionhall}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      connection-test-query: SELECT 1
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${DB_JDBC_URL_UNPOOLED:${DB_JDBC_URL:jdbc:postgresql://localhost:5432/conventionhall}}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsASecretKeyForJWTTokenGenerationMustBe256BitsLong!!}
    expiration-ms: 86400000

logging:
  level:
    com.conventionhall: INFO
