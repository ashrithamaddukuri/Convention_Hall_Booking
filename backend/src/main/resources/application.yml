spring:
  datasource:
    # Accepts either the Neon DATABASE_URL (postgresql://...) or legacy DB_URL (jdbc:postgresql://...)
    # Neon provides postgresql:// scheme; Spring Boot needs jdbc:postgresql://
    # We store the converted URL in DB_JDBC_URL via the env-processor profile,
    # but for simplicity we accept either and Spring resolves placeholders at startup.
    url: ${DB_JDBC_URL:${DB_URL:jdbc:postgresql://localhost:5432/conventionhall}}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000        # 10 min — drop idle connections before Neon closes them
      max-lifetime: 1800000       # 30 min — recycle connections well within Neon's limits
      keepalive-time: 60000       # ping every 60s to keep connections alive
      connection-test-query: SELECT 1  # validate before handing to app
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Use unpooled (direct) connection for migrations as required by Neon best practices
    url: ${DB_JDBC_URL_UNPOOLED:${DB_JDBC_URL:${DB_URL:jdbc:postgresql://localhost:5432/conventionhall}}}
    user: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsASecretKeyForJWTTokenGenerationMustBe256BitsLong!!}
    expiration-ms: 86400000   # 24 hours

logging:
  level:
    com.conventionhall: DEBUG
